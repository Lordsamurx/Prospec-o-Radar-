# Catálogo de nichos da v3: setor -> nicho. É o ÚNICO lugar com texto ou regra de um ramo.
# Nicho novo = uma linha a mais em `niches`. O que o nicho não define, herda do setor.
#
# Campos do nicho:
#   key, sector, label, plural, term (o que o cliente digita no Google), aliases (sem acento),
#   google_types (tipos que contam como "dentro do nicho"; vazio = não checa categoria),
#   type_suffixes, included_type (Text Search; só tipos da Tabela A em google_types.txt),
#   osm (filtros Overpass; mais de um = união), min_rating / min_reviews (limites da nota A),
#   tagline, cta, wa_message, services ([ícone, título, texto]), services_by_type,
#   template (modelo da amostra) e default_offer (serviço que mais vende).
defaults:
  min_rating: 4.0
  min_reviews: 15

