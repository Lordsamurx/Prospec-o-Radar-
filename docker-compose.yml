# docker compose up --build  ->  http://localhost:8000
# O banco fica na pasta de RADAR_DATA_DIR (no .env). Sem ela, em ./data.
# No Windows, deixe fora do OneDrive: RADAR_DATA_DIR=C:/dev/prospeccao-data
# Fictícios de demonstração: docker compose run --rm app python -m app.seed
services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # só na máquina local
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/radar.db
      PREVIEWS_DIR: /app/data/previews
      BACKUPS_DIR: /app/data/backups
    volumes:
      - ${RADAR_DATA_DIR:-./data}:/app/data
    restart: unless-stopped
